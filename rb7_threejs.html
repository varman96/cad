<!doctype html>
<html lang="en">
<head>

<title>RB7 2011 — exploded parametric CAD</title>

<style>
:root{--panel:rgba(12,18,34,.82);--line:rgba(255,255,255,.10);--txt:#e9eefb;--mut:#8b97b5;--acc:#FFC20E;--red:#D8173B;--ok:#3fb950;--bad:#ff4d4f;--warn:#e3b341}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font:13px/1.4 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1300px 900px at 58% 28%,#1a2748 0%,#0b1124 55%,#05070f 100%)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud>*{position:fixed;z-index:5}
.title{left:16px;top:14px;font-size:15px;letter-spacing:.2px;text-shadow:0 1px 8px #000a}
.title b{color:var(--acc)}.title small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.right{right:16px;top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:min(330px,calc(100vw - 32px))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:7px;width:100%}
.panel label{display:flex;align-items:center;gap:8px;color:var(--txt);cursor:pointer}
.panel select{margin-left:auto;background:#0a1124;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;max-width:190px}
.muted{color:var(--mut)}
.views{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
button{font:inherit;color:var(--txt);background:#141d38;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:#1b2750}
button.primary{background:var(--acc);color:#14110a;border-color:transparent;font-weight:700}
button.primary:hover{background:#ffd23d}
.badge{font-weight:700;letter-spacing:.2px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);text-align:left;width:100%}
.badge.pass{background:rgba(63,185,80,.16);border-color:rgba(63,185,80,.55);color:#9be9a8}
.badge.fail{background:rgba(255,77,79,.16);border-color:rgba(255,77,79,.7);color:#ffb3b4;animation:pulse 2.2s ease-in-out infinite}
.badge.pending{background:rgba(227,179,65,.12);border-color:rgba(227,179,65,.5);color:#f1d58a}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,77,79,.18)}}
.bar{left:50%;transform:translateX(-50%);bottom:16px;width:min(980px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px 8px;backdrop-filter:blur(8px)}
.bar .row{display:flex;gap:10px;align-items:center}
.tval{font-variant-numeric:tabular-nums;color:var(--acc);min-width:86px;text-align:right}
input[type=range]{flex:1;accent-color:var(--acc);height:22px}
.stages{position:relative;height:22px;margin-top:6px}
.stage{position:absolute;top:0;height:20px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden;color:var(--mut);font-size:10px}
.stage i{font-style:normal;position:absolute;left:6px;top:2px}
.stage.on{background:rgba(255,194,14,.22);border-color:var(--acc);color:var(--acc)}
.stage.done{background:rgba(255,255,255,.10);color:var(--txt)}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,7,15,.82);font-size:15px}
#loading.hidden{display:none}
.spin{width:30px;height:30px;border:3px solid #2a3558;border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.report{right:0;top:0;bottom:0;width:min(760px,100vw);z-index:15;background:rgba(8,12,25,.94);border-left:1px solid var(--line);overflow:auto;padding:0 18px 40px;backdrop-filter:blur(10px)}
.report.hidden{display:none}
.report header{position:sticky;top:0;background:rgba(8,12,25,.97);display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);z-index:2}
.report h4{margin:20px 0 8px;font-size:13px;letter-spacing:.3px;color:var(--acc)}
.sum{margin:12px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.sum.ok{background:rgba(63,185,80,.12)}.sum.bad{background:rgba(255,77,79,.12);border-color:rgba(255,77,79,.5)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.t th{color:var(--mut);font-weight:600}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.ok td:first-child{border-left:3px solid var(--ok)}
table.t tr.bad td:first-child{border-left:3px solid var(--bad)}
table.t tr.warn td:first-child{border-left:3px solid var(--warn)}
table.t tr.designed td:first-child{border-left:3px solid #5b8def}
table.t .d{color:var(--mut);font-size:11px;margin-top:2px}
tr[data-conf]{cursor:pointer}tr[data-conf]:hover td{background:rgba(255,77,79,.08)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.BRIEF{color:#7db4ff;border-color:#2f5ea8}.tag.DERIVED{color:#7fe0c9;border-color:#2c7f6e}.tag.REGRECALL,.tag.REGCHECK,.tag.ESTREGRECALL{color:#f1c768;border-color:#8a6a1c}
.tag.KIND{color:#ffb3b4;border-color:#a33}
#repClose{font-size:18px;padding:2px 10px}
@media (max-width:760px){.right{max-width:calc(100vw - 32px)}.title small{display:none}.stages{display:none}}

    state.dir *= -1;

    state.dir = 1;

    state.drsTarget = e.target.checked ? 1 : 0;
  };

    invalidate(true);
